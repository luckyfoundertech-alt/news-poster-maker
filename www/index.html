<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><meta name="description" content="NEWS — create professional news posters."><title>NEWS — Poster Studio</title><style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--muted:#9ba6b8;--line:#2c3545;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb;font:15px Inter,system-ui,Arial,sans-serif}header{height:62px;padding:0 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#10131bf2;z-index:5}.brand{font-size:22px;font-weight:900;letter-spacing:2px}.brand span{color:var(--accent)}button{border:1px solid var(--line);background:#252d3b;color:white;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#171717;border:0}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px;max-width:1200px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}.field{margin:0 0 11px}.field label{display:block;font-size:12px;color:#b8c1ce;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#10151e;color:#fff;border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:68px;resize:vertical}.field input[type=color]{height:40px;padding:4px}.stage{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#252d3b,#131822 70%);border:1px solid var(--line);border-radius:14px;padding:12px}.canvas-wrap{width:min(100%,410px);aspect-ratio:4/5;box-shadow:0 12px 35px #0009}canvas{width:100%;height:100%;display:block}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tpl{font-size:11px;padding:9px 4px}.tpl.active{border-color:var(--accent);outline:1px solid var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px}.actions button{flex:1}.hint,.small{font-size:11px;color:var(--muted);line-height:1.5}.status{font-size:12px;color:#a8d9a8;min-height:16px;margin-top:7px}@media(min-width:900px){main{grid-template-columns:330px minmax(300px,1fr) 280px}.stage{grid-column:2;grid-row:1/3;min-height:calc(100vh - 90px)}.right{grid-column:3;grid-row:1/3}.left{grid-column:1;grid-row:1/3}}@media(max-width:520px){main{display:flex;flex-direction:column}.stage{order:-1}.canvas-wrap{width:min(100%,370px)}header{height:56px}}
</style></head><body><header><div class="brand">NEWS<span>.</span></div><button class="primary" id="exportTop">⬇ Export PNG</button></header><main><section class="panel left"><h2>Poster content</h2><div class="field"><label>Headline</label><textarea id="headline">BREAKING: A new chapter begins</textarea></div><div class="field"><label>Short description</label><textarea id="sub">The latest update you need to know. Get the full story and verified details.</textarea></div><div class="field"><label>Category / tag</label><input id="category" value="BREAKING NEWS"></div><div class="field"><label>Publication / brand</label><input id="brand" value="NEWS DESK"></div><div class="field"><label>Upload photo</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>Photo position</label><select id="photoMode"><option value="cover">Full background</option><option value="lower">Bottom image</option><option value="none">No photo</option></select></div><div class="field"><label>Templates</label><div class="templates" id="templates"></div></div></section><section class="stage"><div class="canvas-wrap"><canvas id="poster" width="1080" height="1350"></canvas></div></section><section class="panel right"><h2>Design controls</h2><div class="row"><div class="field"><label>Accent</label><input id="accent" type="color" value="#f2c14e"></div><div class="field"><label>Background</label><input id="background" type="color" value="#101827"></div></div><div class="field"><label>Headline size</label><input id="fontSize" type="range" min="48" max="112" value="82"></div><div class="field"><label>Text alignment</label><select id="align"><option value="left">Left</option><option value="center">Center</option></select></div><div class="field"><label>Footer / website</label><input id="footer" value="Read more at yournews.com"></div><div class="actions"><button class="primary" id="export">Export PNG</button><button id="share">Share</button></div><div class="status" id="status"></div><p class="small">NEWS Poster Studio · Android app</p></section></main>
<script>
const $=id=>document.getElementById(id),canvas=$('poster'),ctx=canvas.getContext('2d');let photo=null,template='breaking';const templates=[['breaking','Breaking'],['classic','Classic'],['minimal','Minimal'],['sports','Sports'],['business','Business'],['alert','Alert']];const state=()=>({headline:$('headline').value,sub:$('sub').value,category:$('category').value,brand:$('brand').value,accent:$('accent').value,bg:$('background').value,size:+$('fontSize').value,align:$('align').value,footer:$('footer').value,mode:$('photoMode').value});function wrap(t,x,y,w,lh,font,color,align='left',max=5){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;let lines=[],line='';for(const word of String(t||'').split(/\s+/)){let v=line?line+' '+word:word;if(ctx.measureText(v).width>w&&line){lines.push(line);line=word}else line=v}if(line)lines.push(line);lines.slice(0,max).forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return Math.min(lines.length,max)}function cover(im,x,y,w,h){let sc=Math.max(w/im.width,h/im.height),sw=w/sc,sh=h/sc;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,w,h)}function draw(){let s=state(),W=1080,H=1350;ctx.fillStyle=s.bg;ctx.fillRect(0,0,W,H);if(s.mode!=='none'&&photo){ctx.save();if(s.mode==='cover'){ctx.globalAlpha=.45;cover(photo,0,0,W,H)}else cover(photo,0,600,W,480);ctx.restore()}if(template==='minimal'){ctx.fillStyle=s.accent;ctx.fillRect(70,70,12,1200)}else if(template==='sports'){ctx.save();ctx.translate(850,-120);ctx.rotate(.25);ctx.fillStyle=s.accent;ctx.fillRect(0,0,240,1700);ctx.restore()}else if(template==='alert'){ctx.fillStyle='#c51f2c';ctx.fillRect(0,0,W,175)}else{ctx.fillStyle=s.accent;ctx.fillRect(0,0,W,18)}let x=s.align==='center'?540:82,align=s.align;if(template==='breaking'||template==='alert'){ctx.fillStyle=template==='alert'?'#fff':s.accent;ctx.fillRect(75,75,300,72);ctx.fillStyle=template==='alert'?'#c51f2c':'#111';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText((s.category||'BREAKING NEWS').toUpperCase(),225,123)}else{ctx.fillStyle=s.accent;ctx.font='bold 32px Arial';ctx.textAlign=align;ctx.fillText((s.category||'LATEST').toUpperCase(),x,135)}let start=template==='alert'?290:template==='minimal'?360:260,n=wrap(s.headline,x,start,900,s.size*1.13,'900 '+s.size+'px Arial','#fff',align,5),sy=start+n*s.size*1.16+36;wrap(s.sub,x,sy,900,42,'34px Arial','#e2e7ef',align,4);ctx.fillStyle=s.accent;ctx.fillRect(80,1190,920,4);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 29px Arial';ctx.fillText((s.brand||'NEWS DESK').toUpperCase(),80,1250);ctx.textAlign='right';ctx.font='24px Arial';ctx.fillStyle='#d3d9e3';ctx.fillText(s.footer||'',1000,1250);if(template==='business'){ctx.fillStyle=s.accent;ctx.font='bold 22px Arial';ctx.textAlign='left';ctx.fillText('MARKET • ECONOMY • POLICY',80,1310)}}templates.forEach(([id,label])=>{let b=document.createElement('button');b.className='tpl'+(id===template?' active':'');b.textContent=label;b.onclick=()=>{template=id;document.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};$('templates').append(b)});['headline','sub','category','brand','accent','background','fontSize','align','footer','photoMode'].forEach(id=>$(id).addEventListener('input',draw));$('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{photo=im;draw();URL.revokeObjectURL(u)};im.src=u});function download(){draw();canvas.toBlob(blob=>{let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='news-poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);$('status').textContent='Poster exported.'},'image/png')}$('export').onclick=download;$('exportTop').onclick=download;$('share').onclick=async()=>{try{let blob=await new Promise(r=>canvas.toBlob(r,'image/png')),file=new File([blob],'news-poster.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'NEWS Poster'});else download()}catch(e){$('status').textContent='Sharing unavailable.'}};draw();</script></body></html>
