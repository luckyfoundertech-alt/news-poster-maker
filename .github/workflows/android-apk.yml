name: Build NEWS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEWS Android shell
        uses: actions/checkout@v4
      - name: Checkout OpenTempl editor source (MIT)
        uses: actions/checkout@v4
        with:
          repository: noah-thing/opentempl
          ref: main
          path: opentempl
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build full OpenTempl editor and template library
        working-directory: opentempl
        run: |
          npm ci
          npm run build -w @opentempl/editor
      - name: Package editor as NEWS Android app
        run: |
          test -f opentempl/dist/app/index.html
          rm -rf www/*
          cp -a opentempl/dist/app/. www/
          sed -i 's/OpenTempl: free open source Canva alternative/NEWS Studio — Design Editor/g' www/index.html
          sed -i 's/<title>OpenTempl/<title>NEWS Studio/' www/index.html
          cp opentempl/LICENSE OPEN-TEMPL-LICENSE
      - name: Verify the full template library is packaged
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = Path("www/templates/index.json")
          if not index.exists():
              raise SystemExit("Template library index missing from Android app")
          data = json.loads(index.read_text(encoding="utf-8"))
          templates = data.get("templates", [])
          vibes = data.get("vibes", {})
          if len(templates) < 300:
              raise SystemExit(f"Expected 300+ templates, found {len(templates)}")
          missing = [t.get("id", "?") for t in templates if not (Path("www/templates") / f"{t.get('vibe')}.json").exists()]
          if missing:
              raise SystemExit(f"Template packs missing for: {', '.join(missing[:10])}")
          print(f"Verified {len(templates)} templates across {len(vibes)} design styles.")
          PY
      - name: Install Android shell dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync full editor into Android
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEWS-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
