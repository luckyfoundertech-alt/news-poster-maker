name: Build NEWS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: news-studio-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout NEWS Android shell
        uses: actions/checkout@v4
      - name: Checkout OpenTempl editor source (MIT)
        uses: actions/checkout@v4
        with:
          repository: noah-thing/opentempl
          # Pin the exact upstream source revision used by the previously successful build.
          ref: 015064f1005e63563f73ebe0dfbeb84d90439bcc
          path: opentempl
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore stable CI debug keystore for repeatable Google Sign-In SHA-1
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: news-studio-debug-keystore-v1
      - name: Remove AI generation UI from NEWS build
        working-directory: opentempl
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("apps/editor/src/App.tsx")
          s = app.read_text()
          s, n1 = re.subn(r"^const Studio = lazy\(.*?\);\n\n", "", s, flags=re.M)
          s, n2 = re.subn(r"  if \(path\.startsWith\('/generate'\)\).*?\n  if \(path\.startsWith\('/open/'\)\)", "  if (path.startsWith('/open/'))", s, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"App AI route patch mismatch: {n1}, {n2}")
          app.write_text(s)
          # These upstream tests exercise the AI generator intentionally removed from NEWS Studio.
          for test_file in ("test/chatgpt-prompt.test.ts", "test/generate.test.ts"):
              path = Path("apps/editor") / test_file
              if path.exists():
                  path.unlink()
          home = Path("apps/editor/src/home/Home.tsx")
          s = home.read_text()
          s = s.replace("import { loadLooks, sampleUrl, type Look } from '../generate/looks';\n", "")
          s = s.replace("  const [looks, setLooks] = useState<Look[]>([]);\n", "")
          s = s.replace("    loadLooks().then(setLooks);\n", "")
          s = s.replace("    document.title = 'OpenTempl';", "    document.title = 'NEWS Studio';")
          s = s.replace('          <a href="#/generate">Generate</a>\n', "")
          s = s.replace('            <a href="#/generate">Generate</a>\n', "")
          s = s.replace("            <PosterBloom looks={looks} />\n", "")
          s, n3 = re.subn(r"        \{looks\.length \? \(.*?\n        \) : null\}\n", "", s, flags=re.S)
          s, n4 = re.subn(r"// Drawn in a 600 x 640 design space\..*?// The template wall:", "// The template wall:", s, flags=re.S)
          if n3 != 1 or n4 != 1 or "#/generate" in s or "loadLooks" in s or "PosterBloom" in s:
              raise SystemExit(f"Home AI UI patch mismatch: section={n3}, bloom={n4}")
          home.write_text(s)

          # Rebrand Android UI and remove desktop download / upstream-owner surfaces.
          home = Path("apps/editor/src/home/Home.tsx")
          body = home.read_text()
          body = body.replace("import { Credit, GitHubLink, SHOW_SOURCE } from '../ui/Credit';", "")
          body = body.replace("import { REPO_URL } from '../links';", "")
          body = body.replace("import { Subscribe } from '../ui/Subscribe';", "")
          body = body.replace("import { SHOW_USAGE_FROM, useUsage } from '../stats/client';", "")
          body = body.replace("  const usage = useUsage();\n", "")
          body = re.sub(r"\s*\{usage && usage\.installs30d >= SHOW_USAGE_FROM \? .*? : null\}", "", body)
          body = re.sub(r"\s*<div className=\"home-foot-sub\">\s*<Subscribe source=\"footer\" />\s*</div>", "", body)
          body = body.replace("Free and open source. Everything you make stays on this computer.", "Your designs, templates and tools in one mobile studio.")
          body = body.replace("const DESKTOP_LINK = !window.tavlaDesktop;", "const DESKTOP_LINK = false;")
          body = body.replace("          <GitHubLink />\n", "")
          body = re.sub(r"\s*\{SHOW_SOURCE \? \(.*?\) : null\}", "", body, flags=re.S)
          body = re.sub(r"\s*\{DESKTOP_LINK \? \(.*?\) : null\}", "", body, flags=re.S)
          body = body.replace("{DESKTOP_LINK ? : null}", "")
          body = re.sub(r"\{DESKTOP_LINK \? .*? : null\}", "", body)
          body = body.replace('            <a href="#/generate">Generate</a>\n', "")
          body = body.replace('          <a href="#/generate">Generate</a>\n', "")
          body = body.replace('        <span className="home-gh">\n        </span>\n', "")
          body = body.replace("              <div className=\"hero-credit\">\n                <Credit />\n              </div>", "")
          body = body.replace("          <GitHubLink label />\n", "").replace("          <Credit />\n", "")
          if "/download" in body or "GitHubLink" in body or "<Credit" in body or "SHOW_SOURCE" in body:
              raise SystemExit("Third-party / desktop download UI remains on Android home")
          home.write_text(body)

          # Rebrand the editor's visible wordmark without removing required MIT notices.
          logo = Path("apps/editor/src/ui/Logo.tsx")
          body = logo.read_text()
          start_mark = body.index("export function Mark(")
          end_mark = body.index("// Wordmark", start_mark)
          body = body[:start_mark] + """export function Mark({ size = 28 }: { size?: number }) {
            return (
              <svg width={size} height={size} viewBox="0 0 96 96" role="img" aria-label="NEWS Studio" style={{ display: 'block', flex: 'none' }}>
                <rect width="96" height="96" rx="22" fill="#10213B" />
                <path d="M20 70V26h12l24 27V26h13v44H57L33 43v27z" fill="#fff" />
                <path d="M75 26h7v44h-7z" fill="#E53945" />
                <path d="M20 78h62" stroke="#E53945" strokeWidth="5" strokeLinecap="round" />
              </svg>
            );
          }

          """ + body[end_mark:]
          body = body.replace("      OpenTempl\n", "      NEWS Studio\n")
          logo.write_text(body)
          start = Path("apps/editor/src/start/Start.tsx")
          body = start.read_text()
          body = body.replace("import { Credit, GitHubLink } from '../ui/Credit';", "")
          body = body.replace('          <a href="#/generate">Generate</a>\n', "")
          body = body.replace("document.title = 'Start a design · OpenTempl';", "document.title = 'Start a design · NEWS Studio';")
          body = re.sub(r"\s*<GitHubLink.*?/>", "", body)
          body = re.sub(r"\s*<Credit.*?/>", "", body)
          body = body.replace("import { Subscribe } from '../ui/Subscribe';", "")
          body = re.sub(r"\s*<Subscribe.*?/>", "", body)
          start.write_text(body)

          # Android safe-area, touch-target and narrow-screen layout improvements.
          css = Path("apps/editor/src/home/home.css")
          body = css.read_text()
          body += """
          @media (max-width:700px) {
            html, body, #root { width:100%; min-width:0; height:100%; overflow:hidden; }
            .home { height:100dvh; min-height:100dvh; padding-bottom:env(safe-area-inset-bottom); }
            .home-top { gap:6px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; flex-wrap:wrap; }
            .home-brand { margin-right:4px; }
            .home-nav { order:3; width:100%; overflow-x:auto; scrollbar-width:none; gap:4px; }
            .home-nav::-webkit-scrollbar { display:none; }
            .home-nav a, .home-nav button { min-height:40px; padding:9px 11px; white-space:nowrap; font-size:13px; }
            .home-open { margin-left:auto; min-height:40px; padding:0 10px; }
            .home main { padding:0 14px calc(28px + env(safe-area-inset-bottom)); }
            .hero { min-height:0; margin-top:0; }
            .hero-in { padding:28px 16px 20px; gap:22px; }
            .hero-top { display:flex; flex-direction:column; align-items:stretch; gap:18px; }
            .hero-copy h1 { font-size:clamp(40px,12vw,64px); }
            .hero-copy p { margin:14px 0 18px; }
            .bloom { width:min(100%,360px); align-self:center; }
            .hero-base { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 12px; margin-top:22px; }
            .hero-ask { grid-column:1/-1; padding:0; }
            .hero-col { grid-column:auto; font-size:12px; }
            .home-section-head { align-items:flex-start; gap:10px; flex-wrap:wrap; }
            .home-foot { flex-wrap:wrap; gap:12px; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
          }
          @media (max-width:380px) {
            .home-top .home-open { font-size:12px; }
            .hero-copy h1 { font-size:39px; }
          }
          """
          css.write_text(body)
          startcss = Path("apps/editor/src/start/start.css")
          body = startcss.read_text()
          body += """
          @media (max-width:700px) {
            .start { min-height:100dvh; }
            .start-head { padding:28px 0 22px; }
            .start-head h1 { font-size:clamp(34px,10vw,48px); }
            .start-block { margin-bottom:36px; }
            .start-sizes { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
            .start-size { min-width:0; padding:11px; }
            .start-custom { grid-column:1/-1; }
            .start-templates { gap:10px; }
            .start-tpl img { height:170px; max-width:44vw; }
            .start-tools { grid-template-columns:1fr; }
            .start-tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:5px; }
            .start-tabs button { flex:none; min-height:40px; }
          }
          """
          startcss.write_text(body)
          app = Path("apps/editor/src/App.tsx")
          body = app.read_text().replace("document.title = 'OpenTempl';", "document.title = 'NEWS Studio';")
          app.write_text(body)
          
          # Remove the upstream AI generation implementation and model runtime entirely.
          import json, shutil
          editor_pkg = Path("apps/editor/package.json")
          pkg = json.loads(editor_pkg.read_text())
          pkg.get("dependencies", {}).pop("@huggingface/transformers", None)
          editor_pkg.write_text(json.dumps(pkg, indent=2) + "\n")
          generation_dir = Path("apps/editor/src/generate")
          if generation_dir.exists():
              shutil.rmtree(generation_dir)
          # Remove AI-powered photo tools too; keep deterministic manual photo filters.
          adjust = Path("apps/editor/src/panels/AdjustPanel.tsx")
          body = adjust.read_text()
          body = body.replace("import { removeBackground } from '../tools/removeBackground';\n", "")
          body = body.replace("import { magicLayers } from '../tools/magicLayers';\n", "")
          body = body.replace("import { hasKey } from '../generate/openai';\n", "")
          body = body.replace("import { Icon } from '../ui/icons';\n", "")
          body, magic_count = re.subn(r"      <Section title=\"Magic\">.*?</Section>\n", "", body, flags=re.S)
          if magic_count != 1:
              raise SystemExit(f"AI photo tools removal mismatch: {magic_count}")
          adjust.write_text(body)
          start = Path("apps/editor/src/start/Start.tsx")
          body = start.read_text()
          lines = body.splitlines(keepends=True)
          kept = [line for line in lines if "name: 'Remove background'" not in line]
          removed = len(lines) - len(kept)
          if removed != 1:
              raise SystemExit(f"AI background-removal feature card mismatch: {removed}")
          start.write_text("".join(kept))
          for path in ["apps/editor/src/tools/magicLayers.ts", "apps/editor/src/tools/removeBackground.ts"]:
              Path(path).unlink(missing_ok=True)
          ai_refs = []
          for source in Path("apps/editor/src").rglob("*"):
              if source.is_file() and source.suffix in {".ts", ".tsx", ".js", ".jsx"}:
                  body = source.read_text(errors="ignore").lower()
                  if "openai" in body or "huggingface" in body or "transformers" in body:
                      ai_refs.append(str(source))
          if ai_refs:
              raise SystemExit("AI implementation references remain: " + ", ".join(ai_refs))
          
          # Add a deterministic RSS newsroom: no AI, article fields are mapped directly into editable text/image layers.
          news = Path("apps/editor/src/home/NewsFeed.tsx")
          news.write_text("""import { useEffect, useState } from 'react';
          import { navigate } from '../App';
          
          type FeedItem = { title: string; description?: string; link?: string; pubDate?: string; author?: string; thumbnail?: string; enclosure?: { link?: string } };
          type NewsItem = { title: string; summary: string; source: string; date: string; link: string; image: string };
          const FEEDS = [
            { name: 'India — English', url: 'https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en' },
            { name: 'India — Hindi', url: 'https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi' },
            { name: 'BBC Hindi', url: 'https://feeds.bbci.co.uk/hindi/rss.xml' },
            { name: 'BBC World', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
          ];
          function clean(value: string) {
            const node = document.createElement('div');
            node.innerHTML = value || '';
            return (node.textContent || '').replace(/\\s+/g, ' ').trim();
          }
          export function NewsFeed() {
            const [feed, setFeed] = useState(FEEDS[0].url);
            const [items, setItems] = useState<NewsItem[]>([]);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [loaded, setLoaded] = useState(false);
            const load = async () => {
              setBusy(true); setError('');
              try {
                const endpoint = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed);
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error('News feed service returned HTTP ' + response.status);
                const data = await response.json();
                if (data.status !== 'ok' || !Array.isArray(data.items)) throw new Error(data.message || 'Could not read this RSS feed');
                const source = clean(data.feed?.title || FEEDS.find((f) => f.url === feed)?.name || 'News');
                setItems(data.items.slice(0, 20).map((item: FeedItem) => ({
                  title: clean(item.title || 'Untitled news'),
                  summary: clean(item.description || '').slice(0, 260),
                  source: clean(item.author || source),
                  date: item.pubDate || '',
                  link: item.link || '',
                  image: item.thumbnail || item.enclosure?.link || '',
                })));
                setLoaded(true);
              } catch (e) {
                setError((e as Error).message || 'News feed unavailable');
              } finally { setBusy(false); }
            };
            useEffect(() => { load(); }, [feed]);
            const makePoster = (item: NewsItem) => {
              const q = new URLSearchParams({ format: 'a3-poster', headline: item.title, summary: item.summary, source: item.source, date: item.date, image: item.image });
              navigate('/new?' + q.toString());
            };
            return <section className="home-section" style={{ border: '1px solid var(--line)', borderRadius: 18, padding: 18, marginBottom: 28 }}>
              <div className="home-section-head">
                <div><h2>Latest news</h2><p className="muted">RSS headlines. Create editable posters using the original article details — no AI.</p></div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                  <select aria-label="News source" value={feed} onChange={(e) => setFeed(e.target.value)} style={{ maxWidth: 190 }}>
          {FEEDS.map((f) => <option key={f.url} value={f.url}>{f.name}</option>)}
                  </select>
                  <button className="btn btn-outline" onClick={load} disabled={busy}>{busy ? 'Refreshing…' : 'Refresh'}</button>
                </div>
              </div>
              {error ? <p role="alert" className="muted">{error} — Check your internet connection and refresh.</p> : null}
              {busy && !items.length ? <p className="muted">Loading headlines…</p> : null}
              {loaded && !items.length && !error ? <p className="muted">No stories found in this feed.</p> : null}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,260px),1fr))', gap: 12 }}>
                {items.map((item, i) => <article key={item.link || item.title + i} style={{ border: '1px solid var(--line)', borderRadius: 12, padding: 12, minWidth: 0 }}>
                  {item.image ? <img src={item.image} alt="" loading="lazy" style={{ width: '100%', height: 130, objectFit: 'cover', borderRadius: 8, marginBottom: 8 }} /> : null}
                  <h3 style={{ fontSize: 16, lineHeight: 1.35, margin: '4px 0 8px' }}>{item.title}</h3>
                  {item.summary ? <p className="muted" style={{ fontSize: 13, lineHeight: 1.45 }}>{item.summary}</p> : null}
                  <p className="muted" style={{ fontSize: 11 }}>{item.source}{item.date ? ' · ' + new Date(item.date).toLocaleString() : ''}</p>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="btn btn-primary" onClick={() => makePoster(item)}>Create poster</button>
          {item.link ? <a className="text-link" href={item.link} target="_blank" rel="noreferrer">Read source</a> : null}
                  </div>
                </article>)}
              </div>
            </section>;
          }
          """)
          home = Path("apps/editor/src/home/Home.tsx")
          body = home.read_text()
          body = body.replace("import './home.css';", "import { NewsFeed } from './NewsFeed';\nimport './home.css';")
          body, inserted = body.replace("<main>\n        <section className=\"home-section\" id=\"your-designs\">", "<main>\n        <NewsFeed />\n        <section className=\"home-section\" id=\"your-designs\">", 1), 1
          if "NewsFeed" not in body:
              raise SystemExit("RSS news panel insertion failed")
          home.write_text(body)
          
          # Deterministically populate an editable A3 poster from RSS fields.
          app = Path("apps/editor/src/App.tsx")
          body = app.read_text()
          body = body.replace("import { createDesign } from './io/designs';", "import { createDesign, openDesign } from './io/designs';")
          body = body.replace("import { formatById } from './doc/formats';", "import { formatById } from './doc/formats';\nimport { makeText, makeImage, TEXT_PRESETS } from './doc/factory';\nimport { prepareImage } from './io/upload';")
          needle = "      window.location.replace(\x60#/d/\x24{id}\x60);"
          fill = """      const headline = q.get('headline')?.trim();
                if (headline) {
                  const opened = await openDesign(id);
                  if (opened) {
          const snap = opened.doc.snapshot;
          const pageId = snap.pageOrder[0];
          const width = snap.meta.width;
          const height = snap.meta.height;
          const summary = q.get('summary') || '';
          const source = q.get('source') || 'NEWS';
          const date = q.get('date') ? new Date(q.get('date')!).toLocaleDateString() : '';
          const imageUrl = q.get('image') || '';
          opened.doc.addElement(pageId, makeText({ ...TEXT_PRESETS.heading, text: headline, x: 72, y: 110, w: width - 144, h: 300, fontSize: Math.min(82, width * 0.075), color: '#111827', fontWeight: 800 }));
          if (summary) opened.doc.addElement(pageId, makeText({ ...TEXT_PRESETS.body, text: summary, x: 76, y: Math.min(520, height * 0.34), w: width - 152, h: 220, fontSize: Math.min(34, width * 0.032), color: '#374151' }));
          if (imageUrl) {
            try {
              const response = await fetch(imageUrl);
              if (response.ok) {
                const asset = await prepareImage(await response.blob(), 'News photo');
                opened.doc.addAsset(asset);
                opened.doc.addElement(pageId, makeImage({ assetId: asset.id, x: 76, y: Math.min(790, height * 0.55), w: width - 152, h: Math.max(180, height * 0.25), name: 'News photo' }));
              }
            } catch { /* The editable headline and summary still work if the publisher blocks image downloads. */ }
          }
          const byline = [source, date].filter(Boolean).join(' · ');
          if (byline) opened.doc.addElement(pageId, makeText({ ...TEXT_PRESETS.body, text: byline, x: 76, y: height - 120, w: width - 152, h: 54, fontSize: 22, color: '#6B7280' }));
          await opened.close();
                  }
                }
                window.location.replace(\x60#/d/\x24{id}\x60);"""
          if needle not in body:
              raise SystemExit("NewDesign redirect insertion point missing")
          body = body.replace(needle, fill, 1)
          app.write_text(body)
          
          # Use Android's native file/share APIs for exports inside the Capacitor WebView.
          exp = Path("apps/editor/src/export/exporters.ts")
          s = exp.read_text()
          if "from '@capacitor/filesystem'" not in s:
              s = s.replace(
                  "import { safeLink } from '../render/safe';",
                  "import { safeLink } from '../render/safe';\nimport { Capacitor } from '@capacitor/core';\nimport { Directory, Filesystem } from '@capacitor/filesystem';\nimport { Share } from '@capacitor/share';"
              )
          old_download = """export function download(blob: Blob, name: string) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          }"""
          new_download = """export async function download(blob: Blob, name: string) {
            if (Capacitor.isNativePlatform()) {
              const bytes = new Uint8Array(await blob.arrayBuffer());
              let binary = '';
              const chunk = 0x8000;
              for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
              }
              const saved = await Filesystem.writeFile({
                path: name,
                data: btoa(binary),
                directory: Directory.Cache,
                recursive: true,
              });
              await Share.share({
                title: name,
                text: 'NEWS Studio export',
                url: saved.uri,
                dialogTitle: 'Save or share your design',
              });
              return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          }"""
          if old_download not in s:
              raise SystemExit("Native export patch: download function not found")
          s = s.replace(old_download, new_download, 1)
          s, calls = re.subn(r"(?<!function )\bdownload\(", "await download(", s)
          if calls < 8:
              raise SystemExit(f"Native export patch: expected export call sites, found {calls}")
          exp.write_text(s)
          PY
      - name: Apply Firebase authentication and cloud-sync implementation
        run: python3 scripts/patch_firebase.py opentempl
      - name: Make cloud restore non-blocking and mobile-safe
        run: python3 scripts/patch_nonblocking_restore.py
      - name: Isolate local workspaces by Firebase account and make cloud sync non-blocking
        run: python3 scripts/patch_account_workspace.py
      - name: Arrange NEWS Studio mobile workspace and global search
        run: python3 scripts/patch_mobile_workspace.py
      - name: Rebrand Android app, create dedicated Newsroom and fix system Back
        run: python3 scripts/patch_brand_newsroom_back.py
      - name: Apply Stitch-inspired Android Home, Projects and bottom navigation
        run: python3 scripts/patch_stitch_pages.py
      - name: Final NEWS Studio brand sweep and Android viewport compatibility
        run: python3 scripts/patch_final_brand_mobile.py apply
      - name: Build NEWS Studio editor and template library
        working-directory: opentempl
        run: |
          # Pin patched transitive packages without downgrading Firebase or forcing unrelated major changes.
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            '@grpc/grpc-js': '1.14.7',
            'minimatch': '11.0.3',
            'image-size': '2.1.0'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          NODE
          npm install --no-fund
          npm install -w @opentempl/editor @capacitor/app@^7.0.1 @capacitor/core@^7.1.0 @capacitor/filesystem@^7.1.4 @capacitor/share@^7.0.2 firebase@^12.6.0 @capacitor-firebase/authentication@^7.2.0 --no-fund
          # Apply only non-breaking fixes. Never use npm audit fix --force in release builds.
          npm audit fix --no-fund || echo "::warning::npm audit fix could not resolve all advisories without breaking changes; continuing to compile and package APK."
          mkdir -p security-reports
          # Keep the full audit report, but do not suppress the APK build when advisories remain.
          npm audit --json > security-reports/npm-audit.json || true
          npm audit --audit-level=high || echo "::warning::High-severity dependency advisories remain; see NEWS-Studio-Security-Audit artifact."
          npm run typecheck -w @opentempl/editor
          npm test -w @opentempl/editor
          npm run build -w @opentempl/editor
      - name: Package editor as NEWS Android app
        run: |
          test -f opentempl/dist/app/index.html
          rm -rf www/*
          cp -a opentempl/dist/app/. www/
          python3 scripts/patch_final_brand_mobile.py verify www
          sed -i 's/OpenTempl: free open source Canva alternative/NEWS Studio — Design Editor/g' www/index.html
          sed -i 's/<title>OpenTempl/<title>NEWS Studio/' www/index.html
          cp opentempl/LICENSE OPEN-TEMPL-LICENSE
      - name: Verify the full template library is packaged
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = Path("www/templates/index.json")
          if not index.exists():
              raise SystemExit("Template library index missing from Android app")
          data = json.loads(index.read_text(encoding="utf-8"))
          templates = data.get("templates", [])
          vibes = data.get("vibes", {})
          if len(templates) < 337:
              raise SystemExit(f"Expected at least 337 templates, found {len(templates)}")
          ids = [t.get("id") for t in templates]
          if any(not template_id for template_id in ids):
              raise SystemExit("One or more templates are missing an ID")
          if len(set(ids)) != len(ids):
              raise SystemExit("Template index contains duplicate IDs")
          missing = [t.get("id", "?") for t in templates if not t.get("vibe") or not (Path("www/templates") / f"{t.get('vibe')}.json").exists()]
          if missing:
              raise SystemExit(f"Template packs missing for: {', '.join(missing[:10])}")
          print(f"Verified {len(templates)} unique templates across {len(vibes)} design styles.")
          PY
      - name: Install Android shell dependencies and native export plugins
        run: |
          npm install
          npm install @capacitor/app@^7.0.1 @capacitor/filesystem@^7.1.4 @capacitor/share@^7.0.2 --no-fund
      - name: Generate Android project
        run: npx cap add android
      - name: Apply NEWS Studio launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/patch_android_launcher_icon.py
      - name: Configure Firebase Android SDK
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/build.gradle")
          body = root.read_text()
          if "com.google.gms:google-services" not in body:
              if "dependencies {" not in body:
                  raise SystemExit("Could not find root Gradle dependencies block")
              body = body.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(body)
          app = Path("android/app/build.gradle")
          body = app.read_text()
          if "com.google.gms.google-services" not in body:
              if re.search(r"plugins\s*\{", body):
                  body = re.sub(r"(plugins\s*\{)", r"\1\n    id 'com.google.gms.google-services'", body, count=1)
              else:
                  body = "apply plugin: 'com.google.gms.google-services'\n" + body
              app.write_text(body)
          variables = Path("android/variables.gradle")
          if variables.exists():
              body = variables.read_text()
              if "rgcfaIncludeGoogle" not in body:
                  if "ext {" not in body:
                      raise SystemExit("Could not find Android variables ext block")
                  body = body.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
                  variables.write_text(body)
          print("Firebase Android config copied and Gradle plugin configured.")
          PY
      - name: Sync full editor into Android
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build signed production APK and AAB when release secrets are configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          body = gradle.read_text()
          if "signingConfigs.release" not in body:
              body += """
          
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
              gradle.write_text(body)
          PY
          cd android
          ./gradlew bundleRelease assembleRelease
      - name: Upload signed production AAB and APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NEWS-Studio-Production-Release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Explain unsigned-only build
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_PASSWORD == '' }}
        run: echo "::warning::Release signing secrets are not configured. Debug APK built; signed Play Store release skipped."
      - name: Print Android debug signing SHA-1 for Firebase Google Sign-In setup
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          [ -f "$KEYSTORE" ] || KEYSTORE="$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
      - name: Upload dependency security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEWS-Studio-Security-Audit
          path: opentempl/security-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEWS-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
