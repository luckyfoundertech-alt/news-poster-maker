name: Build NEWS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEWS Android shell
        uses: actions/checkout@v4
      - name: Checkout OpenTempl editor source (MIT)
        uses: actions/checkout@v4
        with:
          repository: noah-thing/opentempl
          ref: main
          path: opentempl
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove AI generation UI from NEWS build
        working-directory: opentempl
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("apps/editor/src/App.tsx")
          s = app.read_text()
          s, n1 = re.subn(r"^const Studio = lazy\(.*?\);\n\n", "", s, flags=re.M)
          s, n2 = re.subn(r"  if \(path\.startsWith\('/generate'\)\).*?\n  if \(path\.startsWith\('/open/'\)\)", "  if (path.startsWith('/open/'))", s, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"App AI route patch mismatch: {n1}, {n2}")
          app.write_text(s)
          home = Path("apps/editor/src/home/Home.tsx")
          s = home.read_text()
          s = s.replace("import { loadLooks, sampleUrl, type Look } from '../generate/looks';\n", "")
          s = s.replace("  const [looks, setLooks] = useState<Look[]>([]);\n", "")
          s = s.replace("    loadLooks().then(setLooks);\n", "")
          s = s.replace("    document.title = 'OpenTempl';", "    document.title = 'NEWS Studio';")
          s = s.replace('          <a href="#/generate">Generate</a>\n', "")
          s = s.replace('            <a href="#/generate">Generate</a>\n', "")
          s = s.replace("            <PosterBloom looks={looks} />\n", "")
          s, n3 = re.subn(r"        \{looks\.length \? \(.*?\n        \) : null\}\n", "", s, flags=re.S)
          s, n4 = re.subn(r"// Drawn in a 600 x 640 design space\..*?// The template wall:", "// The template wall:", s, flags=re.S)
          if n3 != 1 or n4 != 1 or "#/generate" in s or "loadLooks" in s or "PosterBloom" in s:
              raise SystemExit(f"Home AI UI patch mismatch: section={n3}, bloom={n4}")
          home.write_text(s)

          # Use Android's native file/share APIs for exports inside the Capacitor WebView.
          exp = Path("apps/editor/src/export/exporters.ts")
          s = exp.read_text()
          if "from '@capacitor/filesystem'" not in s:
              s = s.replace(
                  "import { safeLink } from '../render/safe';",
                  "import { safeLink } from '../render/safe';\nimport { Capacitor } from '@capacitor/core';\nimport { Directory, Filesystem } from '@capacitor/filesystem';\nimport { Share } from '@capacitor/share';"
              )
          old_download = """export function download(blob: Blob, name: string) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          }"""
          new_download = """export async function download(blob: Blob, name: string) {
            if (Capacitor.isNativePlatform()) {
              const bytes = new Uint8Array(await blob.arrayBuffer());
              let binary = '';
              const chunk = 0x8000;
              for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
              }
              const saved = await Filesystem.writeFile({
                path: name,
                data: btoa(binary),
                directory: Directory.Cache,
                recursive: true,
              });
              await Share.share({
                title: name,
                text: 'NEWS Studio export',
                url: saved.uri,
                dialogTitle: 'Save or share your design',
              });
              return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          }"""
          if old_download not in s:
              raise SystemExit("Native export patch: download function not found")
          s = s.replace(old_download, new_download, 1)
          s, calls = re.subn(r"(?<!function )\bdownload\(", "await download(", s)
          if calls < 8:
              raise SystemExit(f"Native export patch: expected export call sites, found {calls}")
          exp.write_text(s)
          PY
      - name: Build full OpenTempl editor and template library
        working-directory: opentempl
        run: |
          npm ci
          npm install -w @opentempl/editor @capacitor/core@^7.1.0 @capacitor/filesystem@^7.1.4 @capacitor/share@^7.0.2
          npm run build -w @opentempl/editor
      - name: Package editor as NEWS Android app
        run: |
          test -f opentempl/dist/app/index.html
          rm -rf www/*
          cp -a opentempl/dist/app/. www/
          sed -i 's/OpenTempl: free open source Canva alternative/NEWS Studio — Design Editor/g' www/index.html
          sed -i 's/<title>OpenTempl/<title>NEWS Studio/' www/index.html
          cp opentempl/LICENSE OPEN-TEMPL-LICENSE
      - name: Verify the full template library is packaged
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = Path("www/templates/index.json")
          if not index.exists():
              raise SystemExit("Template library index missing from Android app")
          data = json.loads(index.read_text(encoding="utf-8"))
          templates = data.get("templates", [])
          vibes = data.get("vibes", {})
          if len(templates) < 300:
              raise SystemExit(f"Expected 300+ templates, found {len(templates)}")
          missing = [t.get("id", "?") for t in templates if not (Path("www/templates") / f"{t.get('vibe')}.json").exists()]
          if missing:
              raise SystemExit(f"Template packs missing for: {', '.join(missing[:10])}")
          print(f"Verified {len(templates)} templates across {len(vibes)} design styles.")
          PY
      - name: Install Android shell dependencies and native export plugins
        run: |
          npm install
          npm install @capacitor/filesystem@^7.1.4 @capacitor/share@^7.0.2
      - name: Generate Android project
        run: npx cap add android
      - name: Sync full editor into Android
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEWS-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
