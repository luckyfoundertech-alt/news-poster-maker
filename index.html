<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><meta name="description" content="NEWS — create professional news posters on mobile and desktop."><link rel="manifest" href="manifest.webmanifest"><title>NEWS — Poster Studio</title><style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--muted:#9ba6b8;--line:#2c3545;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb;font:15px Inter,system-ui,Arial,sans-serif}header{height:66px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#10131bf2;z-index:5} .brand{font-size:22px;font-weight:900;letter-spacing:2px}.brand span{color:var(--accent)}.top-actions{display:flex;gap:9px}button,.upload{border:1px solid var(--line);background:#252d3b;color:white;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#171717;border:0}button:hover{filter:brightness(1.12)}main{display:grid;grid-template-columns:340px minmax(300px,1fr) 280px;gap:16px;padding:16px;max-width:1600px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 14px}.field{margin:0 0 13px}.field label{display:block;font-size:12px;color:#b8c1ce;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#10151e;color:#fff;border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:84px;resize:vertical}.field input[type=color]{height:42px;padding:4px}.field input[type=file]{font-size:12px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tpl{padding:9px;text-align:left;font-size:12px;min-height:54px}.tpl.active{border-color:var(--accent);outline:1px solid var(--accent)}.stage{display:flex;align-items:center;justify-content:center;min-height:70vh;background:radial-gradient(ellipse,#252d3b,#131822 70%);border:1px solid var(--line);border-radius:16px;padding:22px;overflow:hidden}.canvas-wrap{width:min(100%,560px);aspect-ratio:4/5;box-shadow:0 18px 55px #0009;position:relative}canvas{display:block;width:100%;height:100%;border-radius:3px}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.small{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.right .field{margin-bottom:16px}.status{font-size:12px;color:#a8d9a8;margin-top:8px;min-height:16px}
@media(max-width:1050px){main{grid-template-columns:300px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.right h2{grid-column:1/-1}.stage{min-height:600px}}@media(max-width:700px){header{padding:0 14px}.top-actions button{padding:9px;font-size:12px}main{display:flex;flex-direction:column;padding:10px;gap:10px}.stage{order:-1;min-height:0;padding:12px}.canvas-wrap{width:min(100%,440px)}.right{display:block}.panel{padding:13px}.templates{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="brand">NEWS<span>.</span></div><div class="top-actions"><button id="reset">Reset</button><button class="primary" id="exportTop">⬇ Export PNG</button></div></header><main>
<section class="panel"><h2>Poster content</h2><div class="field"><label>Headline</label><textarea id="headline">BREAKING: A new chapter begins</textarea></div><div class="field"><label>Short description</label><textarea id="sub">The latest update you need to know. Get the full story and verified details.</textarea></div><div class="field"><label>Category / tag</label><input id="category" value="BREAKING NEWS"></div><div class="field"><label>Publication / brand</label><input id="brand" value="NEWS DESK"></div><div class="field"><label>Upload photo</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>Photo position</label><select id="photoMode"><option value="cover">Full background</option><option value="lower">Bottom image</option><option value="none">No photo</option></select></div><div class="field"><label>Templates</label><div class="templates" id="templates"></div></div><div class="hint">Edit the text and preview updates live. Upload your own image, choose a layout, then export a crisp PNG poster.</div></section>
<section class="stage"><div class="canvas-wrap"><canvas id="poster" width="1080" height="1350"></canvas></div></section>
<section class="panel right"><h2>Design controls</h2><div class="field"><label>Accent color</label><input id="accent" type="color" value="#f2c14e"></div><div class="field"><label>Background color</label><input id="background" type="color" value="#101827"></div><div class="field"><label>Headline size</label><input id="fontSize" type="range" min="48" max="112" value="82"></div><div class="field"><label>Text alignment</label><select id="align"><option value="left">Left</option><option value="center">Center</option></select></div><div class="field"><label>Footer / website</label><input id="footer" value="Read more at yournews.com"></div><div class="actions"><button class="primary" id="export">Export PNG</button><button id="share">Share</button></div><div class="status" id="status"></div><p class="small">NEWS Poster Studio · Works in your browser. Install to home screen for an app-like experience.</p></section></main>
<script>
const $=id=>document.getElementById(id), canvas=$('poster'),ctx=canvas.getContext('2d');let photo=null,template='breaking';const templates=[['breaking','Breaking'],['classic','Classic'],['minimal','Minimal'],['sports','Sports'],['business','Business'],['alert','Alert']];const state=()=>({headline:$('headline').value,sub:$('sub').value,category:$('category').value,brand:$('brand').value,accent:$('accent').value,bg:$('background').value,size:+$('fontSize').value,align:$('align').value,footer:$('footer').value,mode:$('photoMode').value});
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function wrap(text,x,y,maxWidth,lineHeight,font,color,align='left',maxLines=5){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;let words=String(text||'').split(/\s+/),line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return lines.length}
function draw(){const s=state(),W=1080,H=1350;ctx.clearRect(0,0,W,H);ctx.fillStyle=s.bg;ctx.fillRect(0,0,W,H);
if(s.mode!=='none'&&photo){if(s.mode==='cover'){ctx.save();ctx.globalAlpha=.48;cover(photo,0,0,W,H);ctx.restore()}else{cover(photo,0,540,W,590);ctx.fillStyle=s.bg;ctx.fillRect(0,0,W,560)}}
if(template==='minimal'){ctx.fillStyle=s.accent;ctx.fillRect(70,75,12,1200)}else if(template==='sports'){ctx.save();ctx.translate(850,-120);ctx.rotate(.25);ctx.fillStyle=s.accent;ctx.fillRect(0,0,240,1700);ctx.restore()}else if(template==='alert'){ctx.fillStyle='#d62828';ctx.fillRect(0,0,W,175)}else{ctx.fillStyle=s.accent;ctx.fillRect(0,0,W,18)}
const left=s.align==='center'?W/2:82,align=s.align;const textW=900;
if(template==='breaking'||template==='alert'){rounded(75,75,template==='alert'?360:300,72,9,template==='alert'?'#fff':s.accent);ctx.fillStyle=template==='alert'?'#c01818':'#111';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText((s.category||'BREAKING NEWS').toUpperCase(),225,123)}
else{ctx.fillStyle=s.accent;ctx.font='bold 32px Arial';ctx.textAlign=align;ctx.fillText((s.category||'LATEST').toUpperCase(),left,135)}
if(template==='classic'){ctx.fillStyle=s.accent;ctx.fillRect(80,185,920,5)}
const start=template==='alert'?290:template==='minimal'?360:template==='classic'?285:255;const lines=wrap(s.headline,left,start,textW,s.size*1.13,'900 '+s.size+'px Arial','#fff',align,5);const subY=start+lines*s.size*1.16+36;
if(s.mode==='lower'&&photo){ctx.fillStyle=s.bg;ctx.fillRect(0,subY-20,W,1350-subY+20);cover(photo,0,Math.max(subY+125,650),W,Math.min(480,H-Math.max(subY+125,650)))}
wrap(s.sub,left,subY,900,42,'34px Arial','#e2e7ef',align,4);
ctx.fillStyle=s.accent;ctx.fillRect(80,1190,920,4);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 29px Arial';ctx.fillText((s.brand||'NEWS DESK').toUpperCase(),80,1250);ctx.textAlign='right';ctx.font='24px Arial';ctx.fillStyle='#d3d9e3';ctx.fillText(s.footer||'',1000,1250);
if(template==='business'){ctx.fillStyle=s.accent;ctx.font='bold 22px Arial';ctx.textAlign='left';ctx.fillText('MARKET • ECONOMY • POLICY',80,1310)}
}
function cover(img,x,y,w,h){const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
templates.forEach(([id,label])=>{const b=document.createElement('button');b.className='tpl'+(id===template?' active':'');b.textContent=label;b.onclick=()=>{template=id;document.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};$('templates').append(b)});
['headline','sub','category','brand','accent','background','fontSize','align','footer','photoMode'].forEach(id=>$(id).addEventListener('input',draw));
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;draw();URL.revokeObjectURL(url)};im.src=url});
function download(){draw();canvas.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='news-poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$('status').textContent='Poster exported successfully.'},'image/png')}
$('export').onclick=download;$('exportTop').onclick=download;$('share').onclick=async()=>{try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=new File([blob],'news-poster.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'NEWS Poster'});else download()}catch(e){$('status').textContent='Share cancelled or unavailable.'}};
$('reset').onclick=()=>{ $('headline').value='BREAKING: A new chapter begins';$('sub').value='The latest update you need to know. Get the full story and verified details.';$('category').value='BREAKING NEWS';$('brand').value='NEWS DESK';$('footer').value='Read more at yournews.com';$('photo').value='';photo=null;template='breaking';document.querySelectorAll('.tpl').forEach((b,i)=>b.classList.toggle('active',templates[i][0]===template));draw()};
draw();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
